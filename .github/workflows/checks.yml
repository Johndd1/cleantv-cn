name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  device-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test device tools without a TV
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n tools/install.sh tools/restore.sh
